[project]
name = "ci-triage-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "langchain-core",
  "langchain-openai",
  "langgraph",
  "pydantic>=2",
  "pyyaml",
  "httpx",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ci-triage = "ci_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
