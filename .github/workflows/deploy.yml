name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure, no stored client secret
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image
        run: |
          az acr build -r ${{ secrets.ACR_NAME }} -t ci-triage-agent:${{ github.sha }} .
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          TF_VAR_azure_openai_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          TF_VAR_github_token: ${{ secrets.TRIAGE_GITHUB_TOKEN }}
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve
